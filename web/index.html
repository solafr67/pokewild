<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéWild</title>
<meta name="theme-color" content="#0a1220">
<link rel="preload" href="/static/fonts/text-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<main id="app"></main>
<nav class="dock" id="dock" aria-label="Navigation"></nav>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPES={water:"Eau",fire:"Feu",grass:"Plante",electric:"Électrik",ice:"Glace",fighting:"Combat",poison:"Poison",ground:"Sol",flying:"Vol",psychic:"Psy",bug:"Insecte",rock:"Roche",ghost:"Spectre",dragon:"Dragon",dark:"Ténèbres",steel:"Acier",fairy:"Fée",normal:"Normal"};
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/:(\w+?)type:/g,(m,x)=>`<small>[${TYPES[x]||x}]</small>`);
async function api(url,corps){
  const r=await fetch(url,corps===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corps)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401)throw Object.assign(new Error("401"),{code:401});
  if(!r.ok)throw new Error(d.detail||"Erreur");
  return d;
}
const classePV=(pv,max)=>pv/max<.2?"low":pv/max<.5?"mid":"";
const barre=(pv,max)=>`<div class="bar ${classePV(pv,max)}"><i style="width:${Math.max(0,pv/max*100)}%"></i></div>`;
let moi=null, minuteur=null, signature="", H=[];
// Les boutons appellent une fonction rangée dans H : aucun nom de Pokémon n'est jamais collé dans du JS (apostrophes sûres).
const cb=f=>`H[${H.push(f)-1}]()`;

async function accueil(){
  clearInterval(minuteur);
  try{moi=await api("/api/moi")}catch(e){return e.code===401?connexion():app.innerHTML=`<p class="err">${esc(e.message)}</p>`}
  cadre();
  const eq=(await api("/api/equipe")).equipe;
  H=[]; let html=nav("accueil");
  const web=moi.combat.combat_id&&moi.combat.source==="web", discord=moi.combat.combat_id&&!web;
  const blesses=eq.filter(p=>p.pv<p.pv_max).length, ko=eq.filter(p=>p.pv<=0).length;
  let titre,texte,cta;
  if(web){titre="Un combat t'attend";texte="Tu as laissé un combat en cours. Reprends-le là où tu en étais.";cta=`<button class="primary gros" onclick="combat(${moi.combat.combat_id})">Reprendre le combat</button>`}
  else if(discord){titre="Combat en cours sur Discord";texte="Termine-le sur Discord avant d'en lancer un ici.";cta=""}
  else if(!eq.length){titre="Compose ton équipe";texte="Choisis jusqu'à 6 Pokémon pour partir au combat.";cta=`<button class="primary gros" onclick="go('equipe')">Composer mon équipe</button>`}
  else if(ko){titre="Ton équipe a besoin de soins";texte=`${ko} Pokémon K.O. — soigne-les avant de repartir.`;cta=`<button class="primary gros" onclick="go('equipe')">Soigner l'équipe</button><button class="gros" onclick="go('explorer')">Explorer quand même</button>`}
  else{titre="Prêt pour l'aventure";texte=blesses?`${blesses} Pokémon blessé${blesses>1?"s":""} : un soin avant le prochain combat ne fait pas de mal.`:"Ton équipe est en pleine forme.";cta=`<button class="primary gros" onclick="go('explorer')">Partir en exploration</button><button class="gros" onclick="go('modes')">Défier un dresseur</button>`}
  const pct=Math.min(100,Math.round(moi.xp/Math.max(1,moi.xp_requise)*100));
  html+=`<section class="hero"><div class="hero-txt"><small>Bon retour, ${esc(moi.pseudo)}</small><h1>${titre}</h1><p>${texte}</p><div class="actions">${cta}</div>
   <div class="xp"><div class="xp-l"><span>Niveau ${moi.niveau}</span><span>${moi.xp} / ${moi.xp_requise} XP</span></div><div class="bar xpb"><i style="width:${pct}%"></i></div></div></div>
   <div class="vitrine" aria-label="Mon équipe">${eq.length?eq.map((p,i)=>`<button class="vit ${p.pv<=0?"ko":""}" style="--i:${i}" onclick="go('equipe')" title="${esc(p.nom)} — Nv.${p.niveau}"><img src="${esc(p.sprite||"")}" alt="${esc(p.nom)}"><span>${esc(p.nom)}</span><em>Nv.${p.niveau}</em>${barre(p.pv,p.pv_max)}</button>`).join(""):`<div class="vide">Aucun Pokémon dans l'équipe</div>`}</div></section>`;
  const T=[["explorer","compass","Explorer","Rencontre et capture des Pokémon sauvages, lance des expéditions."],["modes","swords","Combattre","Dresseurs, arènes, duels, double combat et raids."],["collection","grid","Collection","Ton équipe, tes Pokémon, le Pokédex, ton sac et le laboratoire."],["boutique","bag","Marché","Boutique, marketplace et échanges entre dresseurs."],["casino","dice","Jeux","Casino et roguelike pour tenter ta chance."],["quetes","scroll","Missions","Objectifs du jour et récompenses à récupérer."]];
  html+=`<div class="tuiles">${T.map(([k,i,t,d])=>`<button class="tuile" onclick="go('${k}')"><span class="ic">${svg(i)}</span><b>${t}</b><small>${d}</small></button>`).join("")}</div><div id="msg"></div>`;
  app.innerHTML=html;
}
function connexion(){app.innerHTML=`<div class="card fin"><h2>Bienvenue sur PokéWild</h2><p>Connecte-toi avec ton compte Discord pour retrouver tes Pokémon.</p><a href="/auth/login"><button class="primary">Se connecter avec Discord</button></a></div>`}
async function lancer(nom){try{const r=await api("/api/combats/dresseur",{archetype:nom});combat(r.combat_id)}catch(e){$("#msg").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}

async function combat(id){
  clearInterval(minuteur); signature="";
  const maj=async()=>{try{rendre(id,await api("/api/combats/"+id))}catch(e){if(e.code===401)connexion()}};
  await maj(); minuteur=setInterval(maj,1500);
}
function hudHTML(p,adv){
  const st=p.statut?`<span class="badge">${esc(p.statut)}</span>`:"";
  const bo=Object.entries(p.boosts||{}).map(([k,v])=>`${k} ${v>0?"+":""}${v}`).join(" · ");
  return `<div class="hud"><b>${esc(p.nom)}</b> Nv.${p.niveau}${st}${barre(p.pv,p.pv_max)}<small>${adv?Math.round(p.pv/p.pv_max*100)+" %":p.pv+"/"+p.pv_max+" PV"}</small>${bo?`<br><small>${esc(bo)}</small>`:""}</div>`;
}
const boules=eq=>`<div class="boules">${eq.map(p=>`<i class="b ${p.ko?"ko":""}"></i>`).join("")}</div>`;
function rendre(id,e){
  if(hubActif!=="combat"){hubActif="combat";marquerHub()}
  const a=e.moi.equipe.find(p=>p.actif), d=e.adversaire.equipe.find(p=>p.actif);
  const sig=[e.tour,e.action_choisie,e.remplacant_requis,e.actif,a&&a.nom,a&&a.pv,d&&d.pv,e.journal[0]&&e.journal[0].tour,!!e.resultat].join("|");
  if(sig===signature){majTimer(e);return}
  signature=sig; H=[];
  const dos=a?esc(a.sprite_dos||a.sprite||""):"", face=a?esc(a.sprite||""):"";
  let h=`<div class="arene"><div class="side adv">${boules(e.adversaire.equipe)}${d?hudHTML(d,true)+`<img src="${esc(d.sprite||"")}" alt="">`:""}</div><div class="side moi">${a?`<img src="${dos}" onerror="this.onerror=null;this.src='${face}'" alt="">`+hudHTML(a,false):""}${boules(e.moi.equipe)}</div></div>`;
  h+=`<div class="card" style="margin-top:14px"><h2>Tour ${e.tour} <span class="pill" id="timer"></span></h2><div id="panneau">${panneau(id,e)}</div><div id="msg"></div></div>`;
  const j=e.journal[0];
  h+=`<div class="card"><h2>Dernier tour${j?` (n°${j.tour})`:""}</h2><div id="log">${j?j.lignes.map(fmt).join("\n"):"Le combat commence !"}</div></div>`;
  if(e.resultat){clearInterval(minuteur);h+=fin(e.resultat)}
  app.innerHTML=h; majTimer(e);
}
function majTimer(e){const t=$("#timer");if(t)t.textContent=e.actif?`· ${e.secondes_restantes} s`:""}
function panneau(id,e){
  if(!e.actif)return "<i>Combat terminé.</i>";
  const ac=e.actions;
  if(e.remplacant_requis)return `<p>Ton Pokémon est K.O. — choisis le suivant :</p><div class="actions">${ac.changements.map(n=>`<button onclick="${cb(()=>agir(id,'remplacant',{nom:n}))}">${esc(n)}</button>`).join("")}</div>`;
  if(e.action_choisie)return "<i>Action enregistrée, en attente de l'adversaire…</i>";
  if(e.verrouille)return "<i>Ton Pokémon est en pleine charge/recharge : rien à choisir ce tour.</i>";
  let h="";
  const at=ac.attaques;
  if(at.mode==="normal")h+=`<div class="moves">${at.attaques.map(m=>`<button style="--tc:${typeCol(m.type)}" ${m.jouable?"":"disabled"} onclick="${cb(()=>agir(id,'action',{type:'attaque',valeur:m.nom,tour:e.tour}))}"><b>${esc(m.nom)}</b><small>${m.type?(TYPES[m.type]||m.type)+" · ":""}${m.puissance?m.puissance+" pui · ":""}${m.pp}/${m.pp_max} PP</small></button>`).join("")}</div>`;
  else h+=`<div class="actions"><button class="primary" onclick="${cb(()=>agir(id,'action',{type:'attaque',tour:e.tour}))}">⚔️ ${esc(at.mode==="lutte"?at.lutte:at.attaques[0].nom)}</button></div>`;
  h+=`<div class="actions">`;
  if(ac.mega)h+=`<button class="primary" onclick="${cb(()=>agir(id,'mega',{}))}">🔷 Méga-Évoluer (${esc(ac.mega.forme)})</button>`;
  for(const p of ac.potions.disponibles)h+=`<button onclick="${cb(()=>agir(id,'action',{type:'potion',valeur:p.type,tour:e.tour}))}">💊 ${esc(p.nom)} ×${p.quantite}</button>`;
  for(const n of ac.changements)h+=`<button onclick="${cb(()=>agir(id,'action',{type:'changer',valeur:n,tour:e.tour}))}">🔄 ${esc(n)}</button>`;
  h+=`<button class="danger" onclick="${cb(()=>{if(confirm('Abandonner ? La défaite sera enregistrée.'))agir(id,'abandon',{})})}">🏳️ Abandonner</button></div>`;
  return h;
}
async function agir(id,route,corps){
  let m="",erreur=false;
  try{const r=await api(`/api/combats/${id}/${route}`,corps);m=r.message||""}
  catch(e){m=e.message;erreur=true}
  signature="";
  try{rendre(id,await api("/api/combats/"+id))}catch(_){}
  if(m){const z=$("#msg");if(z)z.innerHTML=`<div class="msg${erreur?" err":""}">${esc(m)}</div>`}
}
function fin(r){
  const ti={victoire:"🏆 Victoire !",defaite:"💀 Défaite…",abandon:"🏳️ Combat abandonné",annule:"⚠️ Combat annulé (erreur)"}[r.issue]||"Fin";
  const g=r.recompenses;
  let t=g?`+${g.dollars} ₽ · +${g.xp} XP${g.reduite?" <small>(réduit : déjà beaucoup de dresseurs battus aujourd'hui)</small>":""}`:"Aucune récompense.";
  if(g&&g.mise)t+=`<br>💰 +${g.mise} PD de mise remportée !`;
  if(r.forfait)t+=`<br><small>(victoire/défaite par forfait)</small>`;
  if(g&&g.niveau_dresseur.apres>g.niveau_dresseur.avant)t+=`<br>⬆️ Niveau dresseur ${g.niveau_dresseur.apres} !`;
  for(const q of (g?g.quetes_completees:[]))t+=`<br>✅ Quête : ${esc(q.nom||"")}`;
  t+=suiteHTML(r.suite);
  const retour=r.suite?`<button class="primary" onclick="pageModes()">Retour aux Combats</button>`:`<button class="primary" onclick="accueil()">Retour</button>`;
  return `<div class="card fin"><h2>${ti}</h2><p>${t}</p>${retour}</div>`;
}
/* ===== Gestion du compte : équipe, attaques, inventaire, Pokédex ===== */
const RARETES={legendaire:"Légendaire",hyper_rare:"Hyper rare",rare:"Rare",peu_commun:"Peu commun",commun:"Commun"};
const TCOL={normal:"#a8a77a",fire:"#ee8130",water:"#6390f0",grass:"#7ac74c",electric:"#f7d02c",ice:"#96d9d6",fighting:"#c22e28",poison:"#a33ea1",ground:"#e2bf65",flying:"#a98ff3",psychic:"#f95587",bug:"#a6b91a",rock:"#b6a136",ghost:"#735797",dragon:"#6f35fc",dark:"#705746",steel:"#b7b7ce",fairy:"#d685ad"};
const FR_EN={feu:"fire",eau:"water",plante:"grass",electrik:"electric",glace:"ice",combat:"fighting",sol:"ground",vol:"flying",psy:"psychic",insecte:"bug",roche:"rock",spectre:"ghost",tenebres:"dark",acier:"steel",fee:"fairy"};
const typeKey=x=>{const k=String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();return TCOL[k]?k:(FR_EN[k]||k)};
const typeCol=x=>TCOL[typeKey(x)]||"var(--line-2)";
const typesHTML=t=>(t||[]).map(x=>`<span class="tag type" style="--tc:${typeCol(x)}">${esc(x)}</span>`).join("");
const PAGES={accueil,explorer:pageExplorer,explorations:pageExplorations,equipe:pageEquipe,modes:pageModes,pvp:pageDefis,marche:pageMarche,echanges:pageEchanges,casino:pageCasino,raids:pageRaids,duo:pageDuo,rogue:pageRogue,boutique:pageBoutique,labo:pageLabo,quetes:pageQuetes,inventaire:pageInventaire,pokedex:pagePokedex,collection:pageCollection,classements:pageClassements};
const go=k=>PAGES[k]();
const IC={
 home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
 compass:'<circle cx="12" cy="12" r="9"/><path d="m15.8 8.2-2 5.6-5.6 2 2-5.6z"/>',
 swords:'<path d="m14 5 6-2 1 1-2 6-9.5 9.5L7 17.5 4.5 20 3 18.5 5.5 16 4 14.5 13.5 5z" transform="translate(0 0)"/><path d="m9 5-5-2-1 1 2 6 3 3"/>',
 grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
 bag:'<path d="M5.5 8h13l1 12.5h-15z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/>',
 dice:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M9.5 16.5v-9h3.2a2.6 2.6 0 0 1 0 5.2H9.5"/>',
 scroll:'<path d="M6 3.5h12v14a3 3 0 0 0 3 3H9a3 3 0 0 1-3-3z"/><path d="M9.5 8h5M9.5 12h5"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5v1.5A3.5 3.5 0 0 0 8 11M16 6h3.5v1.5A3.5 3.5 0 0 1 16 11"/><path d="M12 13v4M8.5 20.5h7M10 17h4"/>',
 out:'<path d="M9 4.5H5.5v15H9"/><path d="m15 8 4 4-4 4M19 12H9.5"/>'
};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const BALL='<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#f4f7fc"/><path d="M2 16a14 14 0 0 1 28 0z" fill="#ff5446"/><path d="M2 16h28" stroke="#0a1220" stroke-width="2.4"/><circle cx="16" cy="16" r="5" fill="#f4f7fc" stroke="#0a1220" stroke-width="2.4"/><circle cx="16" cy="16" r="14" fill="none" stroke="#0a1220" stroke-width="2"/></svg>';
// 6 grandes sections ; chaque section regroupe plusieurs écrans (onglets).
const HUBS=[
 {k:"accueil",l:"Accueil",ic:"home",p:[["accueil","Tableau de bord"],["quetes","Missions"],["classements","Classements"]]},
 {k:"explorer",l:"Explorer",ic:"compass",p:[["explorer","Rencontres"],["explorations","Expéditions"]]},
 {k:"combat",l:"Combattre",ic:"swords",p:[["modes","Dresseurs & Arènes"],["pvp","Duels"],["duo","Double combat"],["raids","Raids"]]},
 {k:"collection",l:"Collection",ic:"grid",p:[["equipe","Équipe"],["collection","Pokémon"],["pokedex","Pokédex"],["inventaire","Sac"],["labo","Laboratoire"]]},
 {k:"marche",l:"Marché",ic:"bag",p:[["boutique","Boutique"],["marche","Marketplace"],["echanges","Échanges"]]},
 {k:"jeux",l:"Jeux",ic:"dice",p:[["casino","Casino"],["rogue","Roguelike"]]}
];
let hubActif="accueil";
const hubDe=k=>HUBS.find(h=>h.p.some(x=>x[0]===k))||HUBS[0];
function marquerHub(){
  document.querySelectorAll("[data-hub]").forEach(b=>b.getAttribute("aria-current")!==null&&b.removeAttribute("aria-current"));
  document.querySelectorAll(`[data-hub="${hubActif}"]`).forEach(b=>b.setAttribute("aria-current","page"));
}
// Renvoie la barre d'onglets de la section ; met aussi à jour la barre du haut.
const nav=a=>{
  const h=hubDe(a); hubActif=h.k; marquerHub(); window.scrollTo(0,0);
  return h.p.length<2?"":`<div class="soustitre" role="tablist">${h.p.map(([k,l])=>`<button role="tab" ${k===a?'aria-current="page"':""} onclick="go('${k}')">${l}</button>`).join("")}</div>`;
};
function cadre(){
  const m=moi, pct=m?Math.min(100,Math.round(m.xp/Math.max(1,m.xp_requise)*100)):0;
  $("#topbar").innerHTML=`<button class="marque" onclick="go('accueil')" aria-label="PokéWild — accueil">${BALL}PokéWild</button>`
   +(m?`<div class="hubs">${HUBS.map(h=>`<button class="hub" data-hub="${h.k}" onclick="go('${h.p[0][0]}')">${svg(h.ic)}<span>${h.l}</span></button>`).join("")}</div><div class="sp"></div>
   <div class="puces"><button class="puce or" onclick="go('quetes')" title="Missions">${svg("scroll")}<span class="lib">Missions</span></button>
   <div class="puce or" style="cursor:default" title="Poké Dollars">${svg("coin")}<b>${Number(m.poke_dollars).toLocaleString("fr-FR")}</b></div>
   <div class="niveau" title="${m.xp} / ${m.xp_requise} XP"><div class="anneau" style="--p:${pct}"><span>${m.niveau}</span></div><small>Niveau ${m.niveau}</small></div>
   <div class="profil"><button id="profilBtn" aria-haspopup="menu" aria-expanded="false">${m.avatar?`<img src="${esc(m.avatar)}" alt="">`:`<i class="ini">${esc(m.pseudo.slice(0,1).toUpperCase())}</i>`}<span>${esc(m.pseudo)}</span></button>
    <div class="menu" id="menuProfil" hidden role="menu"><div class="nom">Connecté en tant que <b>${esc(m.pseudo)}</b></div>
    <button onclick="go('classements')">${svg("trophy")}Classements</button><button onclick="go('quetes')">${svg("scroll")}Missions</button>
    <a href="/auth/logout">${svg("out")}Déconnexion</a></div></div></div>`:"");
  $("#dock").innerHTML=m?HUBS.map(h=>`<button data-hub="${h.k}" onclick="go('${h.p[0][0]}')">${svg(h.ic)}${h.l}</button>`).join(""):"";
  const bp=$("#profilBtn"); if(bp)bp.onclick=e=>{e.stopPropagation();const mn=$("#menuProfil");mn.hidden=!mn.hidden;bp.setAttribute("aria-expanded",String(!mn.hidden))};
  marquerHub();
}
document.addEventListener("click",e=>{const mn=$("#menuProfil");if(mn&&!mn.hidden&&!e.target.closest(".profil")){mn.hidden=true}});
function flash(t,err){const m=$("#msg");if(m)m.innerHTML=t?`<div class="msg ${err?"err":""}">${esc(t)}</div>`:""}
async function act(f){try{await f()}catch(e){if(e.code===401)return connexion();flash(e.message,true)}}
const sel=(id)=>{const e=document.getElementById(id);return e?e.value:""};
let tri="alphabetique", rech="";

async function pageEquipe(msgInitial){
  clearInterval(minuteur);
  let eq,inv,pr;
  try{[eq,inv,pr]=await Promise.all([api("/api/gestion/equipe"),api("/api/gestion/inventaire"),api("/api/gestion/presets")])}
  catch(e){return e.code===401?connexion():app.innerHTML=`<p class="err">${esc(e.message)}</p>`}
  H=[];
  const potions=inv.objets.filter(o=>o.potion);
  let h=nav("equipe")+`<div id="msg">${msgInitial?`<div class="msg">${esc(msgInitial)}</div>`:""}</div>`;
  h+=`<div class="card"><h2>Mon équipe de combat (${eq.equipe.length}/${eq.taille_max})</h2>`;
  if(eq.en_combat)h+=`<div class="msg">Un combat est en cours : les soins sont bloqués (utilise les potions dans le combat).</div>`;
  if(!eq.equipe.length)h+=`<p>Ton équipe est vide : ajoute des Pokémon ci-dessous.</p>`;
  h+=`<div class="grid">${eq.equipe.map((p,i)=>{
    const blesse=p.pv<p.pv_max;
    return `<div class="mon ${p.pv<=0?"ko":""}"><img src="${esc(p.sprite||"")}" alt=""><div><b>${esc(p.nom)}</b> · Nv.${p.niveau}</div>${typesHTML(p.types)}${p.indisponible?`<div><small class="err">⏳ indisponible (exploration/caisson)</small></div>`:""}${barre(p.pv,p.pv_max)}<small>${p.pv}/${p.pv_max} PV · ${p.nb_attaques}/4 attaques</small>
    <div class="rang"><button ${i===0?"disabled":""} onclick="${cb(()=>bouger(p.nom,-1))}">◀</button><button ${i===eq.equipe.length-1?"disabled":""} onclick="${cb(()=>bouger(p.nom,1))}">▶</button><button onclick="${cb(()=>pageAttaques(p.nom))}">⚔️</button><button class="danger" onclick="${cb(()=>retirer(p.nom))}">✕</button></div>

let ongletLabo="incubateur", triCaisson="alphabetique", rechCaisson="";
const ONGLETS_LABO=[["incubateur","🥚 Incubateur"],["transformateur","🔬 Transformateur"],["caisson","🧫 Caisson"],["mutation","🧬 Mutation"]];
async function pageLabo(msgInitial,erreur){
  clearInterval(minuteur); H=[];
  app.innerHTML=nav("labo")+`<div id="msg">${msgInitial?`<div class="msg ${erreur?"err":""}">${msgInitial}</div>`:""}</div><div class="card"><div class="nav">${ONGLETS_LABO.map(([k,l])=>`<button class="${k===ongletLabo?"primary":""}" onclick="${cb(()=>{ongletLabo=k;pageLabo()})}">${l}</button>`).join("")}</div><div id="labo">Chargement…</div></div>`;

async function majLabo(){
  const el=$("#labo");if(!el){clearInterval(minuteur);return}
  const base=H.length;
  if(ongletLabo==="incubateur"){
    const d=await api("/api/labo/incubateur");if(!$("#labo"))return;
    let h="";
    if(d.slot)h+=`<div class="ligne"><b>🥚 ${esc(d.slot.nom)}</b><span class="sp"></span>${d.slot.prete?`<button class="primary" onclick="${cb(()=>eclore())}">🎉 Faire éclore</button>`:`<span>⏳ ${dureeTxt(d.slot.secondes_restantes)}</span>`}</div>`;
    else h+=`<p>Emplacement libre.</p>`;
    h+=`<h2 style="margin-top:12px">🎒 Œufs en stock</h2>`+(d.oeufs.map(o=>`<div class="ligne"><b>${esc(o.nom)}</b> ×${o.quantite}<small>éclosion en ${dureeTxt(o.duree)}</small><span class="sp"></span><button onclick="${cb(()=>incuber(o.palier))}" ${d.slot?"disabled":""}>Incuber</button></div>`).join("")||"<small>Aucun œuf : on en trouve au PokéStop, en exploration ou en capture.</small>");
    el.innerHTML=h;
  }else if(ongletLabo==="transformateur"){
    const d=await api("/api/labo/transformateur");if(!$("#labo"))return;
    el.innerHTML=`<p><small>Convertis des lots d'objets d'un palier en 1 du palier supérieur. La Master Ball et le Total Soin ne peuvent pas être obtenus ainsi.</small></p>`+d.chaines.map(c=>`<div class="ligne"><b>${esc(c.source_nom)}</b> ×${c.possede}<small>${c.requis} → 1 ${esc(c.cible_nom)}</small><span class="sp"></span><input type="number" min="1" max="${Math.max(1,c.lots_possibles)}" value="${Math.max(1,c.lots_possibles)}" id="t_${esc(c.source)}" style="width:64px"><button onclick="${cb(()=>transformer(c.source))}" ${c.lots_possibles?"":"disabled"}>Transformer</button></div>`).join("");
  }else if(ongletLabo==="caisson"){
    const d=await api(`/api/labo/caisson?tri=${encodeURIComponent(triCaisson)}&q=${encodeURIComponent(rechCaisson)}`);if(!$("#labo"))return;
    const libre=d.slots.some(s=>s.libre);
    let h=`<p><small>${d.xp_par_heure} XP par heure et par Pokémon ; l'XP est créditée quand tu le retires. Un Pokémon au Caisson n'est pas disponible en combat.</small></p>`+d.slots.map(s=>s.libre?`<div class="ligne"><b>Emplacement ${s.slot}</b><small>vide</small></div>`:`<div class="ligne"><b>Emplacement ${s.slot} — ${esc(s.nom)}</b><small>depuis ${dureeTxt(s.secondes)} · ${s.xp_en_attente} XP en attente</small><span class="sp"></span><button class="primary" onclick="${cb(()=>retirerCaisson(s.slot))}">📤 Retirer</button></div>`).join("");
    if(libre){
      h+=`<h2 style="margin-top:12px">Déposer un Pokémon</h2><div class="ligne"><input placeholder="🔍 Rechercher" value="${esc(rechCaisson)}" oninput="rechCaisson=this.value;majLabo()"><select onchange="triCaisson=this.value;majLabo()">${[["alphabetique","Alphabétique"],["rarete","Rareté"],["niveau_asc","Niveau croissant"]].map(([v,l])=>`<option value="${v}" ${v===triCaisson?"selected":""}>${l}</option>`).join("")}</select></div><div class="liste">${d.especes.map(e=>`<div class="ligne"><b>${esc(e.nom)}</b><small>Nv.${e.niveau} · ${e.pc} PC${e.en_exploration?" · en exploration":""}</small><span class="sp"></span><button onclick="${cb(()=>deposerCaisson(e.nom))}" ${e.en_exploration?"disabled":""}>Déposer</button></div>`).join("")||"<small>Aucun résultat.</small>"}</div>${d.nb_especes>d.especes.length?`<small>… ${d.nb_especes-d.especes.length} de plus : affine la recherche.</small>`:""}`;
    }
    const foc=document.activeElement&&document.activeElement.tagName==="INPUT"; el.innerHTML=h;
    if(foc){const i=el.querySelector("input");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  }else{
    const d=await api("/api/labo/mutation");if(!$("#labo"))return;
    el.innerHTML=(d.race?`<h2>🧬 ${esc(d.race.nom)} <small>(${esc(d.race.palier)})</small></h2><p><i>${esc(d.race.description)}</i></p><p>${esc(d.race.bonus)}</p>`:`<p>Tu n'as pas encore de Mutation : utilise un 🔮 Cristal de Mutation pour en tirer une au hasard (on en gagne en exploration).</p>`)+`<div class="ligne"><span>🔮 Cristaux : <b>${d.cristaux}</b></span><small>Pity : ${d.pity}/${d.pity_seuil}</small><span class="sp"></span><button class="primary" onclick="${cb(()=>muter())}" ${d.cristaux?"":"disabled"}>Utiliser un Cristal</button></div><small>Chaque tirage remplace ta Mutation actuelle.</small>`;
  }
}

const muter=()=>actLabo(async()=>{const r=await api("/api/labo/mutation",{});return `🔮 Nouvelle Mutation : <b>${esc(r.race.nom)}</b> (${esc(r.race.palier)})`});

function suiteHTML(s){
  if(!s)return "";
  let t="";
  if(s.gagne){
    t+=`<br>💰 +${s.dollars} PD${s.reduite?" <small>(réduit : plusieurs runs déjà faits aujourd'hui)</small>":""}`;
    if(s.fin){
      t+=`<br>🏆 <b>${s.kind==="arene"?"Champion":"Boss"} vaincu !</b>`;
      if(s.badge_nouveau)t+=`<br>🎖️ <b>Nouveau badge !</b> ${esc(s.bonus||"")}`;
      if(s.ct)t+=`<br>📀 CT <b>${esc(s.ct)}</b> offerte`;
      for(const o of (s.objets||[]))t+=`<br>✨ Butin rarissime : <b>${esc(o)}</b>`;
    }else t+=`<br>➡️ Combat ${s.etape}/3 réussi — soigne ton équipe si besoin, puis continue.`;
  }else t+=`<br>💀 Ta tentative s'arrête là. Retente à la prochaine ouverture.`;
  return t;
}

let rechPvp="";
async function pageDefis(msgInitial,erreur){
  clearInterval(minuteur); H=[];
  app.innerHTML=nav("pvp")+`<div id="msg">${msgInitial?`<div class="msg ${erreur?"err":""}">${msgInitial}</div>`:""}</div><div class="card"><small>Défie un autre joueur connecté au site. Équipes complètes, 45 s par tour. Mise optionnelle (max 20 % du solde du plus pauvre) : le vainqueur remporte le pot.</small></div><div id="pv">Chargement…</div>`;
  const maj=async()=>{
    if(!$("#pv")){clearInterval(minuteur);return}
    let d; try{d=await api("/api/pvp?q="+encodeURIComponent(rechPvp))}catch(e){if(e.code===401){clearInterval(minuteur);connexion()}return}
    if(d.combat_en_cours){clearInterval(minuteur);return combat(d.combat_en_cours)}
    if(document.activeElement&&document.activeElement.id==="pv_q"&&$("#pv_liste")){majListe(d);return}
    let h=`<div class="card"><h2>📨 Défis reçus</h2>`+(d.recus.map(x=>`<div class="ligne"><b>${esc(x.de_pseudo)}</b>${x.mise?`<small>mise ${x.mise} PD</small>`:""}<small>${x.secondes_restantes}s</small><span class="sp"></span><button class="primary" onclick="${cb(()=>repondrePvp(x.id,true))}">✅ Accepter</button><button onclick="${cb(()=>repondrePvp(x.id,false))}">Refuser</button></div>`).join("")||"<small>Aucun défi reçu.</small>")+`</div>`;
    h+=`<div class="card"><h2>📤 Défis envoyés</h2>`+(d.envoyes.map(x=>`<div class="ligne"><b>${esc(x.a_pseudo)}</b>${x.mise?`<small>mise ${x.mise} PD</small>`:""}<small>${x.secondes_restantes}s</small><span class="sp"></span><button onclick="${cb(()=>repondrePvp(x.id,false))}">Annuler</button></div>`).join("")||"<small>Aucun défi en attente.</small>")+`</div>`;
    h+=`<div class="card"><h2>👥 Joueurs</h2><div class="ligne"><input id="pv_q" placeholder="🔍 Rechercher un joueur" value="${esc(rechPvp)}" oninput="rechPvp=this.value;majPvpListe()"><label><small>Mise (PD)</small> <input id="pv_mise" type="number" min="0" value="0" style="width:80px"></label><small>Solde : ${d.solde}</small></div><div id="pv_liste"></div></div>`;
    $("#pv").innerHTML=h; majListe(d);
  };
  const majListe=d=>{const z=$("#pv_liste");if(z)z.innerHTML=d.joueurs.map(j=>`<div class="ligne"><b>${j.en_ligne?"🟢":"⚪"} ${esc(j.pseudo)}</b><span class="sp"></span><button onclick="${cb(()=>defierPvp(j.id))}">⚔️ Défier</button></div>`).join("")||"<small>Aucun joueur trouvé (il doit s'être connecté au site au moins une fois).</small>"};
  window.majPvpListe=()=>{clearTimeout(window._tPvp);window._tPvp=setTimeout(maj,250)};
  await maj(); minuteur=setInterval(maj,3000);
}
const defierPvp=async id=>{try{const r=await api("/api/pvp/defier",{cible_id:id,mise:parseInt(sel("pv_mise"))||0});pageDefis(esc(r.message))}catch(e){if(e.code===401)return connexion();flash(e.message,true)}};

  <div class="ligne"><input id="co_q" placeholder="🔍 Nom ou surnom" value="${esc(e.q)}" oninput="collEtat.q=this.value;collEtat.page=0;clearTimeout(window._tc);window._tc=setTimeout(majCollection,300)">
  <select onchange="collEtat.tri=this.value;majCollection()">${[["alphabetique","Alphabétique"],["pc_desc","PC décroissant"],["favoris_dabord","Favoris d'abord"],["verrouilles_dabord","Verrouillés d'abord"]].map(([v,l])=>opt(v,l,e.tri)).join("")}</select>
  <select onchange="collEtat.filtre=this.value;collEtat.page=0;majCollection()">${[["tous","Tous"],["doublons","Doublons"],["favoris","Favoris"],["verrouilles","Verrouillés"],["shiny","Shiny"]].map(([v,l])=>opt(v,l,e.filtre)).join("")}</select></div>
  <div class="actions"><button onclick="${cb(()=>apercuRelacher())}">👋 Relâcher les doublons</button>${e.sel.size?`<button class="danger" onclick="${cb(()=>supprimerSel())}">🗑️ Supprimer la sélection (${e.sel.size})</button><button onclick="${cb(()=>{e.sel.clear();majCollection()})}">Désélectionner</button>`:""}</div><div id="co_zone"></div>`;

  if(d.nb_pages>1)h+=`<div class="actions"><button ${d.page?"":"disabled"} onclick="${cb(()=>{e.page--;majCollection()})}">◀</button><span>Page ${d.page+1}/${d.nb_pages}</span><button ${d.page<d.nb_pages-1?"":"disabled"} onclick="${cb(()=>{e.page++;majCollection()})}">▶</button></div>`;
  const foc=document.activeElement&&document.activeElement.id==="co_q"; z.innerHTML=h;
  if(foc){const i=$("#co_q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}

       +(a.type==="directe"?`<b>${a.prix} PD</b>${a.mienne?`<button onclick="${cb(()=>retirerAnn(a.id))}">Retirer</button>`:`<button class="primary" onclick="${cb(()=>acheterAnn(a.id,a.prix))}">🛒 Acheter</button>`}`

    if(d.nb_pages>1)h+=`<div class="actions"><button ${d.page?"":"disabled"} onclick="${cb(()=>{mk.page--;majMarche()})}">◀</button><span>Page ${d.page+1}/${d.nb_pages}</span><button ${d.page<d.nb_pages-1?"":"disabled"} onclick="${cb(()=>{mk.page++;majMarche()})}">▶</button></div>`;

    else corps=`<p>🎉 <b>Victoire !</b> Récompenses reçues (${r.recompense.pd} PD, ${r.recompense.xp} XP).</p>`+(r.capture_reussie?"<p>✅ Capturé !</p>":r.tentatives>0?`<div class="actions"><button class="primary" onclick="${cb(()=>actR(()=>api("/api/raids/capturer",{raid_id:r.id})))}">⚾ Capturer (${Math.round((r.taux_capture||0)*100)}% de base) — ${r.tentatives} tentative(s)</button></div>`:"<p>Plus de tentatives.</p>");
    const cl=r.classement.length?`<details><summary>🏆 Participants</summary>${r.classement.map(c=>`<div class="ligne"><span>${c.moi?"👉 ":""}${esc(c.pseudo)}</span><span class="sp"></span><b>${c.degats}</b></div>`).join("")}</details>`:"";
    return `<div class="card" style="border:1px solid #888"><div class="ligne"><img src="${esc(r.sprite||"")}" width="64" height="64" alt=""><div><b>${esc(r.boss)}</b> ${et}</div></div>${corps}${cl}</div>`;
  }).join("");
  h+=`</div><div class="card"><h2>🛡️ Mon équipe ${d.equipe_en_raid?"(PV du raid)":""}</h2>`+(d.equipe.map(m=>`<div class="ligne"><img src="${esc(m.sprite||"")}" width="32" height="32" alt=""><b>${esc(m.nom)}</b>${m.dispo?"":" <small>(indisponible)</small>"}<span class="sp"></span>${m.pv<=0?"☠️ K.O.":m.pv+"/"+m.pv_max+" PV"}</div>`).join("")||"<small>Équipe vide.</small>")+`<div class="actions"><button onclick="${cb(()=>actR(()=>api("/api/raids/equipe-auto",{})))}">🛡️ Équipe la plus forte</button></div><small>Potions : ${Object.entries(d.potions).map(([k,v])=>v+"× "+k).join(", ")||"aucune"}</small></div>`;
  z.innerHTML=h;

      h+=`<div class="card" style="border:1px solid #888"><b>${esc(s.actif?s.actif.nom:"—")}</b>${act}</div>`;
    }
    h+=`<div class="actions"><button class="danger" onclick="${cb(()=>{if(confirm("Abandonner le combat ? Ça concerne toute ton équipe."))duoAgir(id,"abandonner",{})})}">🏳️ Abandonner</button></div>`;
  }else if(e.resultat){
    const r=e.resultat;
    h+=`<div class="msg ${r.issue==="victoire"?"":"err"}">${{victoire:"🏆 Victoire !",defaite:"💀 Défaite…",abandon:"🏳️ Abandon",annule:"⚠️ Combat annulé"}[r.issue]||r.issue}${r.recompenses?` — +${r.recompenses.dollars} PD, +${r.recompenses.xp} XP`:""}</div><div class="actions"><button class="primary" onclick="${cb(()=>pageDuo())}">Retour</button></div>`;
  }
  const dern=e.journal.slice(-3).reverse();
  h+=`</div>`+(dern.length?`<div class="card"><h3>📜 Journal</h3>${dern.map(t=>`<details ${t===dern[0]?"open":""}><summary>Tour ${t.tour}</summary>${t.lignes.map(l=>`<div>${esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</div>`).join("")}</details>`).join("")}</div>`:"");
  z.innerHTML=h;
}
async function duoAgir(id,route,corps){
  try{await api("/api/duo/"+id+"/"+route,corps);dd={attaque:null,cle:null};await majEntete();const e=await api("/api/duo/"+id);dessDuo(id,e)}catch(e){if(e.code===401)return connexion();flash(e.message,true)}
}

/* ===== Roguelike ===== */
let rg={sous:"jeu"};
async function pageRogue(msgInitial,erreur){
  clearInterval(minuteur); H=[];
  app.innerHTML=nav("rogue")+`<div id="msg">${msgInitial?`<div class="msg ${erreur?"err":""}">${msgInitial}</div>`:""}</div><div class="card"><div class="nav"><button class="${rg.sous==="jeu"?"primary":""}" onclick="${cb(()=>{rg.sous="jeu";pageRogue()})}">🗺️ Run</button><button class="${rg.sous==="top"?"primary":""}" onclick="${cb(()=>{rg.sous="top";pageRogue()})}">🏆 Classement</button></div><div id="rz">Chargement…</div></div>`;
  try{
    if(rg.sous==="top"){const d=await api("/api/rogue/classement");$("#rz").innerHTML=d.classement.map(c=>`<div class="ligne"><b>${c.rang}.</b> <span>${c.moi?"👉 ":""}${esc(c.pseudo)}</span><span class="sp"></span>salle ${c.etage}</div>`).join("")||"<small>Aucune run terminée.</small>";return}
    dessRogue(await api("/api/rogue"));
  }catch(e){if(e.code===401)return connexion();flash(e.message,true)}
}
const rgAct=async(a,v="")=>{try{dessRogue(await api("/api/rogue/agir",{action:a,valeur:String(v)}))}catch(e){if(e.code===401)return connexion();flash(e.message,true)}};
const rgBar=(a,b)=>`<div style="background:#ddd;border-radius:6px;height:10px;overflow:hidden"><div style="width:${b?Math.max(0,Math.round(a/b*100)):0}%;background:${a/b>.5?"#3a3":a/b>.2?"#ea3":"#d33"};height:100%"></div></div>`;
function dessRogue(d){
  const z=$("#rz"); if(!z)return;
  const sp=n=>d.sprites&&d.sprites[n]?`<img src="${esc(d.sprites[n])}" height="56" alt="">`:"";
  let h="";
  if(d.discord)h=`<p>Une run est en cours <b>sur Discord</b> (salle ${d.run.salle}). Continue-la là-bas, ou abandonne-la ici pour jouer sur le site.</p><div class="actions"><button class="danger" onclick="${cb(()=>{if(confirm("Abandonner la run ?"))rgAbandon()})}">🏳️ Abandonner</button></div>`;
  else if(!d.run){
    const e=d.ecran;
    h=(e?`<div class="msg ${e.type==="fin"?"err":""}">${esc(e.titre)} — ${esc(e.texte)}${e.nouveau_record?" 🏆 Nouveau record !":""}</div>`:"")+`<p>Mini-jeu indépendant : équipe de génériques, permadeath, sans fin, aucune récompense liée à ton profil — juste un classement du meilleur étage.${d.record?` Ton record : salle ${d.record}.`:""}</p><div class="actions"><button class="primary" onclick="${cb(()=>rgDemarrer())}">▶️ Nouvelle run</button></div>`;
  }else{
    const e=d.ecran, r=d.run;
    h=`<p><b>Salle ${r.salle}</b>${r.reliques.length?" · "+r.reliques.map(x=>`<span title="${esc(x.description)}">${x.emoji} ${esc(x.nom)}</span>`).join(" · "):""}</p>`;
    h+=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${r.equipe.map(m=>`<div class="hud" style="text-align:center;${e.actif===m.position?"outline:2px solid #38f":""}">${sp(m.nom)}<br><b>${esc(m.nom)}</b> Nv.${m.niveau}${m.mute?" 🔮":""}${m.pv<=0?" 💀":""}${rgBar(m.pv,m.pv_max)}<small>${m.pv}/${m.pv_max} PV</small></div>`).join("")}</div><hr>`;
    h+=`<h3>${esc(e.titre)}</h3>`+((e.annonces||[]).length?`<small>${e.annonces.map(esc).join("<br>")}</small>`:"")+(e.texte?`<p>${esc(e.texte).replace(/\n/g,"<br>")}</p>`:"");
    const btn=(l,a,v,c)=>`<button class="${c||""}" onclick="${cb(()=>rgAct(a,v))}">${l}</button>`;
    const pos=lst=>lst.map(p=>{const m=r.equipe.find(x=>x.position===p);return btn(`${esc(m.nom)} (Nv.${m.niveau})`,e.type==="mutation"?"muter":"evoluer",p,"primary")}).join("");
    switch(e.type){
      case"starter":h+=`<div class="actions">${e.candidats.map(n=>`<button class="primary" onclick="${cb(()=>rgAct("starter",n))}">${sp(n)}<br>${esc(n)}</button>`).join("")}</div>`;break;
      case"continuer":h+=`<div class="actions">${btn("➡️ Continuer","continuer","","primary")}</div>`;break;
      case"evenement":h+=`<div class="actions">${e.choix.map((c,i)=>btn(esc(c),"evenement",i)).join("")}</div>`;break;
      case"tresor":h+=e.reliques.map(x=>`<div class="ligne">${x.emoji} <b>${esc(x.nom)}</b> <small>${esc(x.description)}</small><span class="sp"></span>${btn("Prendre","relique",x.id,"primary")}</div>`).join("");break;
      case"recrutement":h+=`<div class="actions">${e.options.map(n=>`<button class="primary" onclick="${cb(()=>rgAct("recruter",n))}">${sp(n)}<br>${esc(n)}</button>`).join("")}${btn("Passer","recruter","passer")}</div>`;break;
      case"marchand":h+=`<div class="actions">${btn("💊 Soin (+40 % PV)","marchand","soin","primary")}${btn("💎 Relique aléatoire","marchand","relique")}</div>`;break;
      case"mutation":case"evolution":h+=`<div class="actions">${pos(e.candidats)}</div>`;break;
      case"scintillante":h+=`<div class="actions">${btn("⚔️ Combattre","combattre","","danger")}${btn("🏃 Fuir","fuir")}</div>`;break;
      case"carrefour":h+=`<div class="actions">${e.options.map(t=>btn(esc(e.noms[t]),"carrefour",t,"primary")).join("")}</div>`;break;
      case"arene":h+=`<div class="actions">${[e.a,e.b].map(n=>`<button class="primary" onclick="${cb(()=>rgAct("parier",n))}">${sp(n)}<br>🎲 ${esc(n)}</button>`).join("")}</div>`;break;
      case"combat":{
        const en=e.ennemi;
        h+=en?`<div class="hud" style="text-align:center">${sp(en.nom)}<br><b>${esc(en.nom)}</b> Nv.${en.niveau}${e.restants?` <small>(+${e.restants} à suivre)</small>`:""}${rgBar(en.pv,en.pv_max)}<small>${en.pv}/${en.pv_max} PV</small></div>`:"";
        h+=`<div class="actions">${e.attaques.map((a,i)=>btn(`${esc(a.nom)} <small>${a.puissance} pcs</small>`,"attaquer",i,"danger")).join("")}</div>`;
        if(e.log&&e.log.length)h+=`<div class="card">${e.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div>`;
        break}
    }
    h+=`<div class="actions"><button onclick="${cb(()=>{if(confirm("Abandonner la run ? Toute la progression est perdue."))rgAbandon()})}">🏳️ Abandonner</button></div>`;
  }
  z.innerHTML=h;
}
async function rgDemarrer(){try{dessRogue(await api("/api/rogue/demarrer",{}))}catch(e){if(e.code===401)return connexion();flash(e.message,true)}}
async function rgAbandon(){try{dessRogue(await api("/api/rogue/abandonner",{}))}catch(e){flash(e.message,true)}}

cadre();
accueil();
</script>
