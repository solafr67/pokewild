<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéWild</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#1d2330;--mut:#6b7385;--bord:#dde1e8;--acc:#e5483b;--ok:#2e9e5b;--warn:#e0a21a;--bad:#d23c3c}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e222b;--txt:#e8ebf1;--mut:#9aa3b5;--bord:#2e3441}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bord)}
header h1{font-size:18px;margin:0;flex:1}header img{width:28px;height:28px;border-radius:50%}
.pill{font-size:13px;color:var(--mut)}main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mon{border:1px solid var(--bord);border-radius:10px;padding:8px;text-align:center;font-size:13px}.mon img{height:64px;image-rendering:pixelated}
button{font:inherit;border:1px solid var(--bord);background:var(--card);color:var(--txt);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}button.danger{color:var(--bad)}
.bar{height:8px;background:var(--bord);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok);transition:width .4s}
.bar.mid>i{background:var(--warn)}.bar.low>i{background:var(--bad)}
.arene{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;min-height:230px;padding:14px;border-radius:12px;border:1px solid var(--bord);background:linear-gradient(#cfe8ff,#e9f5df)}
@media (prefers-color-scheme:dark){.arene{background:linear-gradient(#25364d,#2a3a2c)}}
.side{display:flex;flex-direction:column;gap:6px}.side.adv{grid-column:2;grid-row:1;align-items:flex-end}.side.moi{grid-column:1;grid-row:2;align-items:flex-start}
.side img{height:110px;image-rendering:pixelated}.hud{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:8px 10px;min-width:210px;font-size:13px}
.hud b{font-size:14px}.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:var(--warn);color:#000;margin-left:4px}
.boules{font-size:12px;letter-spacing:2px;color:var(--mut)}.ko{opacity:.35}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.moves button{text-align:left}.moves small{display:block;color:var(--mut)}
#log{font-size:13px;line-height:1.5;max-height:200px;overflow:auto;white-space:pre-wrap}
.msg{padding:8px 12px;border-radius:8px;background:var(--bord);margin-top:8px;font-size:13px}.err{color:var(--bad)}
.fin{text-align:center;padding:20px}.fin h2{font-size:22px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tag{display:inline-block;font-size:11px;padding:0 6px;margin:1px;border-radius:8px;background:var(--bord)}
.rang{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}.rang button{padding:3px 7px;font-size:12px}
.ligne{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:5px 0;border-bottom:1px solid var(--bord)}.ligne:last-child{border-bottom:0}.sp{flex:1}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--bord);border-radius:8px;background:var(--card);color:var(--txt)}
.liste{max-height:430px;overflow:auto}.mon.choisi{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.mon small{display:block;color:var(--mut)}
.msg.shiny{background:#f6e27a;color:#000}</style>
</head>
<body>
<header><img id="avatar" hidden alt=""><h1>PokéWild</h1><span class="pill" id="infos"></span><a id="sortie" class="pill" href="/auth/logout" hidden>Déconnexion</a></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPES={water:"Eau",fire:"Feu",grass:"Plante",electric:"Électrik",ice:"Glace",fighting:"Combat",poison:"Poison",ground:"Sol",flying:"Vol",psychic:"Psy",bug:"Insecte",rock:"Roche",ghost:"Spectre",dragon:"Dragon",dark:"Ténèbres",steel:"Acier",fairy:"Fée",normal:"Normal"};
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/:(\w+?)type:/g,(m,x)=>`<small>[${TYPES[x]||x}]</small>`);
async function api(url,corps){
  const r=await fetch(url,corps===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corps)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401)throw Object.assign(new Error("401"),{code:401});
  if(!r.ok)throw new Error(d.detail||"Erreur");
  return d;
}
const classePV=(pv,max)=>pv/max<.2?"low":pv/max<.5?"mid":"";
const barre=(pv,max)=>`<div class="bar ${classePV(pv,max)}"><i style="width:${Math.max(0,pv/max*100)}%"></i></div>`;
let moi=null, minuteur=null, signature="", H=[];
// Les boutons appellent une fonction rangée dans H : aucun nom de Pokémon n'est jamais collé dans du JS (apostrophes sûres).
const cb=f=>`H[${H.push(f)-1}]()`;

async function accueil(){
  clearInterval(minuteur);
  try{moi=await api("/api/moi")}catch(e){return e.code===401?connexion():app.innerHTML=`<p class="err">${esc(e.message)}</p>`}
  $("#avatar").hidden=!moi.avatar; if(moi.avatar)$("#avatar").src=moi.avatar;
  $("#infos").textContent=`${moi.pseudo} · Nv.${moi.niveau} · ${moi.poke_dollars} ₽`; $("#sortie").hidden=false;
  const [eq,dr]=await Promise.all([api("/api/equipe"),api("/api/dresseurs")]);
  H=[]; let html=nav("accueil");
  if(moi.combat.combat_id&&moi.combat.source==="web")html+=`<div class="card">Un combat est en cours. <button class="primary" onclick="combat(${moi.combat.combat_id})">Reprendre</button></div>`;
  else if(moi.combat.combat_id)html+=`<div class="card">Tu es déjà en combat sur Discord : termine-le avant d'en lancer un ici.</div>`;
  html+=`<div class="card"><h2>Mon équipe de combat</h2>`+(eq.equipe.length?`<div class="grid">${eq.equipe.map(p=>`<div class="mon ${p.pv<=0?"ko":""}"><img src="${esc(p.sprite||"")}" alt=""><div><b>${esc(p.nom)}</b> · Nv.${p.niveau}</div>${barre(p.pv,p.pv_max)}<small>${p.pv}/${p.pv_max} PV</small></div>`).join("")}</div>`:`<p>Ton équipe de combat est vide. <button class="primary" onclick="pageEquipe()">Composer mon équipe</button></p>`)+`<div class="actions"><button onclick="pageEquipe()">⚔️ Gérer l'équipe</button></div></div>`;
  html+=`<div class="card"><h2>Défier un dresseur</h2><div class="grid">${dr.dresseurs.map(d=>`<button onclick="${cb(()=>lancer(d.nom))}">${d.emoji} ${esc(d.nom)}<br><small>Tier ${d.tier}</small></button>`).join("")}<button class="primary" onclick="${cb(()=>lancer(null))}">🎲 Au hasard</button></div><div id="msg"></div></div>`;
  app.innerHTML=html;
}
function connexion(){app.innerHTML=`<div class="card fin"><h2>Bienvenue sur PokéWild</h2><p>Connecte-toi avec ton compte Discord pour retrouver tes Pokémon.</p><a href="/auth/login"><button class="primary">Se connecter avec Discord</button></a></div>`}
async function lancer(nom){try{const r=await api("/api/combats/dresseur",{archetype:nom});combat(r.combat_id)}catch(e){$("#msg").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}

async function combat(id){
  clearInterval(minuteur); signature="";
  const maj=async()=>{try{rendre(id,await api("/api/combats/"+id))}catch(e){if(e.code===401)connexion()}};
  await maj(); minuteur=setInterval(maj,1500);
}
function hudHTML(p,adv){
  const st=p.statut?`<span class="badge">${esc(p.statut)}</span>`:"";
  const bo=Object.entries(p.boosts||{}).map(([k,v])=>`${k} ${v>0?"+":""}${v}`).join(" · ");
  return `<div class="hud"><b>${esc(p.nom)}</b> Nv.${p.niveau}${st}${barre(p.pv,p.pv_max)}<small>${adv?Math.round(p.pv/p.pv_max*100)+" %":p.pv+"/"+p.pv_max+" PV"}</small>${bo?`<br><small>${esc(bo)}</small>`:""}</div>`;
}
const boules=eq=>`<div class="boules">${eq.map(p=>p.ko?"✖":"●").join(" ")}</div>`;
function rendre(id,e){
  const a=e.moi.equipe.find(p=>p.actif), d=e.adversaire.equipe.find(p=>p.actif);
  const sig=[e.tour,e.action_choisie,e.remplacant_requis,e.actif,a&&a.nom,a&&a.pv,d&&d.pv,e.journal[0]&&e.journal[0].tour,!!e.resultat].join("|");
  if(sig===signature){majTimer(e);return}
  signature=sig; H=[];
  const dos=a?esc(a.sprite_dos||a.sprite||""):"", face=a?esc(a.sprite||""):"";
  let h=`<div class="arene"><div class="side adv">${boules(e.adversaire.equipe)}${d?hudHTML(d,true)+`<img src="${esc(d.sprite||"")}" alt="">`:""}</div><div class="side moi">${a?`<img src="${dos}" onerror="this.onerror=null;this.src='${face}'" alt="">`+hudHTML(a,false):""}${boules(e.moi.equipe)}</div></div>`;
  h+=`<div class="card" style="margin-top:14px"><h2>Tour ${e.tour} <span class="pill" id="timer"></span></h2><div id="panneau">${panneau(id,e)}</div><div id="msg"></div></div>`;
  const j=e.journal[0];
  h+=`<div class="card"><h2>Dernier tour${j?` (n°${j.tour})`:""}</h2><div id="log">${j?j.lignes.map(fmt).join("\n"):"Le combat commence !"}</div></div>`;
  if(e.resultat){clearInterval(minuteur);h+=fin(e.resultat)}
  app.innerHTML=h; majTimer(e);
}
function majTimer(e){const t=$("#timer");if(t)t.textContent=e.actif?`· ${e.secondes_restantes} s`:""}
function panneau(id,e){
  if(!e.actif)return "<i>Combat terminé.</i>";
  const ac=e.actions;
  if(e.remplacant_requis)return `<p>Ton Pokémon est K.O. — choisis le suivant :</p><div class="actions">${ac.changements.map(n=>`<button onclick="${cb(()=>agir(id,'remplacant',{nom:n}))}">${esc(n)}</button>`).join("")}</div>`;
  if(e.action_choisie)return "<i>Action enregistrée, en attente de l'adversaire…</i>";
  if(e.verrouille)return "<i>Ton Pokémon est en pleine charge/recharge : rien à choisir ce tour.</i>";
  let h="";
  const at=ac.attaques;
  if(at.mode==="normal")h+=`<div class="moves">${at.attaques.map(m=>`<button ${m.jouable?"":"disabled"} onclick="${cb(()=>agir(id,'action',{type:'attaque',valeur:m.nom,tour:e.tour}))}"><b>${esc(m.nom)}</b><small>${m.type?(TYPES[m.type]||m.type)+" · ":""}${m.puissance?m.puissance+" pui · ":""}${m.pp}/${m.pp_max} PP</small></button>`).join("")}</div>`;
  else h+=`<div class="actions"><button class="primary" onclick="${cb(()=>agir(id,'action',{type:'attaque',tour:e.tour}))}">⚔️ ${esc(at.mode==="lutte"?at.lutte:at.attaques[0].nom)}</button></div>`;
  h+=`<div class="actions">`;
  if(ac.mega)h+=`<button class="primary" onclick="${cb(()=>agir(id,'mega',{}))}">🔷 Méga-Évoluer (${esc(ac.mega.forme)})</button>`;
  for(const p of ac.potions.disponibles)h+=`<button onclick="${cb(()=>agir(id,'action',{type:'potion',valeur:p.type,tour:e.tour}))}">💊 ${esc(p.nom)} ×${p.quantite}</button>`;
  for(const n of ac.changements)h+=`<button onclick="${cb(()=>agir(id,'action',{type:'changer',valeur:n,tour:e.tour}))}">🔄 ${esc(n)}</button>`;
  h+=`<button class="danger" onclick="${cb(()=>{if(confirm('Abandonner ? La défaite sera enregistrée.'))agir(id,'abandon',{})})}">🏳️ Abandonner</button></div>`;
  return h;
}
async function agir(id,route,corps){
  let m="",erreur=false;
  try{const r=await api(`/api/combats/${id}/${route}`,corps);m=r.message||""}
  catch(e){m=e.message;erreur=true}
  signature="";
  try{rendre(id,await api("/api/combats/"+id))}catch(_){}
  if(m){const z=$("#msg");if(z)z.innerHTML=`<div class="msg${erreur?" err":""}">${esc(m)}</div>`}
}
function fin(r){
  const ti={victoire:"🏆 Victoire !",defaite:"💀 Défaite…",abandon:"🏳️ Combat abandonné",annule:"⚠️ Combat annulé (erreur)"}[r.issue]||"Fin";
  const g=r.recompenses;
  let t=g?`+${g.dollars} ₽ · +${g.xp} XP${g.reduite?" <small>(réduit : déjà beaucoup de dresseurs battus aujourd'hui)</small>":""}`:"Aucune récompense.";
  if(g&&g.mise)t+=`<br>💰 +${g.mise} PD de mise remportée !`;
  if(r.forfait)t+=`<br><small>(victoire/défaite par forfait)</small>`;
  if(g&&g.niveau_dresseur.apres>g.niveau_dresseur.avant)t+=`<br>⬆️ Niveau dresseur ${g.niveau_dresseur.apres} !`;
  for(const q of (g?g.quetes_completees:[]))t+=`<br>✅ Quête : ${esc(q.nom||"")}`;
  t+=suiteHTML(r.suite);
  const retour=r.suite?`<button class="primary" onclick="pageModes()">Retour aux Combats</button>`:`<button class="primary" onclick="accueil()">Retour</button>`;
  return `<div class="card fin"><h2>${ti}</h2><p>${t}</p>${retour}</div>`;
}
/* ===== Gestion du compte : équipe, attaques, inventaire, Pokédex ===== */
const RARETES={legendaire:"Légendaire",hyper_rare:"Hyper rare",rare:"Rare",peu_commun:"Peu commun",commun:"Commun"};
const typesHTML=t=>(t||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("");
const nav=a=>`<div class="nav">${[["accueil","🏠 Accueil"],["explorer","🌿 Explorer"],["explorations","🗺️ Explorations"],["equipe","⚔️ Équipe"],["modes","🏟️ Combats"],["pvp","🥊 PvP"],["boutique","🛒 Boutique"],["labo","🧪 Laboratoire"],["quetes","📜 Quêtes"],["inventaire","🎒 Inventaire"],["pokedex","📖 Pokédex"]].map(([k,l])=>`<button class="${k===a?"primary":""}" onclick="${cb(()=>({accueil,explorer:pageExplorer,explorations:pageExplorations,equipe:pageEquipe,modes:pageModes,pvp:pageDefis,boutique:pageBoutique,labo:pageLabo,quetes:pageQuetes,inventaire:pageInventaire,pokedex:pagePokedex}[k]()))}">${l}</button>`).join("")}</div>`;
function flash(t,err){const m=$("#msg");if(m)m.innerHTML=t?`<div class="msg ${err?"err":""}">${esc(t)}</div>`:""}
async function act(f){try{await f()}catch(e){if(e.code===401)return connexion();flash(e.message,true)}}
const sel=(id)=>{const e=document.getElementById(id);return e?e.value:""};
let tri="alphabetique", rech="";

async function pageEquipe(msgInitial){
  clearInterval(minuteur);
  let eq,inv,pr;
  try{[eq,inv,pr]=await Promise.all([api("/api/gestion/equipe"),api("/api/gestion/inventaire"),api("/api/gestion/presets")])}
  catch(e){return e.code===401?connexion():app.innerHTML=`<p class="err">${esc(e.message)}</p>`}
  H=[];
  const potions=inv.objets.filter(o=>o.potion);
  let h=nav("equipe")+`<div id="msg">${msgInitial?`<div class="msg">${esc(msgInitial)}</div>`:""}</div>`;
  h+=`<div class="card"><h2>Mon équipe de combat (${eq.equipe.length}/${eq.taille_max})</h2>`;
  if(eq.en_combat)h+=`<div class="msg">Un combat est en cours : les soins sont bloqués (utilise les potions dans le combat).</div>`;
  if(!eq.equipe.length)h+=`<p>Ton équipe est vide : ajoute des Pokémon ci-dessous.</p>`;
  h+=`<div class="grid">${eq.equipe.map((p,i)=>{
    const blesse=p.pv<p.pv_max;
    return `<div class="mon ${p.pv<=0?"ko":""}"><img src="${esc(p.sprite||"")}" alt=""><div><b>${esc(p.nom)}</b> · Nv.${p.niveau}</div>${typesHTML(p.types)}${p.indisponible?`<div><small class="err">⏳ indisponible (exploration/caisson)</small></div>`:""}${barre(p.pv,p.pv_max)}<small>${p.pv}/${p.pv_max} PV · ${p.nb_attaques}/4 attaques</small>
    <div class="rang"><button ${i===0?"disabled":""} onclick="${cb(()=>bouger(p.nom,-1))}">◀</button><button ${i===eq.equipe.length-1?"disabled":""} onclick="${cb(()=>bouger(p.nom,1))}">▶</button><button onclick="${cb(()=>pageAttaques(p.nom))}">⚔️</button><button class="danger" onclick="${cb(()=>retirer(p.nom))}">✕</button></div>
    ${blesse&&!eq.en_combat?`<div class="rang">${potions.map(o=>`<button title="${esc(o.nom)}" onclick="${cb(()=>soigner(p.nom,o.cle))}">❤️ ${esc(o.nom.replace("Potion","Pot."))} ×${o.quantite}</button>`).join("")||"<small>Aucune potion</small>"}</div>`:""}</div>`}).join("")}</div>`;
  h+=`<div class="actions"><button class="primary" onclick="${cb(()=>auto())}">🏆 Meilleure équipe</button><button onclick="${cb(()=>soinAuto())}" ${eq.en_combat?"disabled":""}>🩹 Soin auto</button></div></div>`;
  h+=`<div class="card"><h2>Équipes sauvegardées (${pr.presets.length}/${eq.taille_max_presets})</h2>${pr.presets.map(p=>`<div class="ligne"><b>${esc(p.nom)}</b> <small>${esc(p.pokemon.join(", "))}</small><span class="sp"></span><button onclick="${cb(()=>chargerPreset(p.nom))}">Charger</button><button class="danger" onclick="${cb(()=>supprPreset(p.nom))}">🗑️</button></div>`).join("")||"<small>Aucune.</small>"}
    <div class="ligne"><input id="nomPreset" maxlength="30" placeholder="Nom de l'équipe actuelle"><button onclick="${cb(()=>sauverPreset())}">💾 Sauvegarder</button></div></div>`;
  h+=`<div class="card"><h2>Ajouter un Pokémon</h2><div class="ligne"><input id="rech" placeholder="🔍 Rechercher" value="${esc(rech)}" oninput="rech=this.value;majEspeces()"><select id="tri" onchange="tri=this.value;majEspeces()">${[["alphabetique","Alphabétique"],["rarete","Rareté"],["pc_desc","PC : fort → faible"],["pc_asc","PC : faible → fort"]].map(([v,l])=>`<option value="${v}" ${v===tri?"selected":""}>${l}</option>`).join("")}</select></div><div id="especes" class="grid"></div></div>`;
  app.innerHTML=h; majEspeces();
  window._eqPleine=eq.equipe.length>=eq.taille_max;
}
async function majEspeces(){
  const el=$("#especes");if(!el)return;
  const r=await api(`/api/gestion/especes?tri=${encodeURIComponent(tri)}&q=${encodeURIComponent(rech)}`).catch(()=>null);
  if(!r||!$("#especes"))return;
  const base=H.length; // callbacks propres à ce bloc
  el.innerHTML=r.especes.slice(0,60).map(p=>`<div class="mon"><img src="${esc(p.sprite||"")}" alt="" loading="lazy"><div><b>${esc(p.nom)}</b>${p.shiny?" ✨":""}</div>${typesHTML(p.types)}<small>${p.pc} PC${p.rarete?" · "+esc(RARETES[p.rarete]||p.rarete):""}</small>${p.indisponible?`<small class="err">⏳ indisponible</small>`:""}<div class="rang"><button onclick="${cb(()=>ajouter(p.nom))}">➕ Ajouter</button></div></div>`).join("")||"<small>Aucun résultat.</small>";
  if(r.especes.length>60)el.insertAdjacentHTML("beforeend",`<small>… ${r.especes.length-60} de plus : affine la recherche.</small>`);
}
const rechargerEquipe=m=>pageEquipe(m);
const ajouter=n=>act(async()=>{await api("/api/gestion/equipe/ajouter",{nom:n});rechargerEquipe()});
const retirer=n=>act(async()=>{await api("/api/gestion/equipe/retirer",{nom:n});rechargerEquipe()});
const bouger=(n,d)=>act(async()=>{await api("/api/gestion/equipe/deplacer",{nom:n,direction:d});rechargerEquipe()});
const auto=()=>act(async()=>{await api("/api/gestion/equipe/auto",{});rechargerEquipe("Équipe composée avec tes meilleurs Pokémon disponibles.")});
const soigner=(n,p)=>act(async()=>{await api("/api/gestion/soigner",{nom:n,potion:p});rechargerEquipe()});
const soinAuto=()=>act(async()=>{const r=await api("/api/gestion/soin-auto",{});rechargerEquipe(`Soins : ${r.potions_utilisees} potion(s) utilisée(s).`)});
const sauverPreset=()=>act(async()=>{await api("/api/gestion/presets/sauvegarder",{nom:sel("nomPreset")});rechargerEquipe("Équipe sauvegardée.")});
const chargerPreset=n=>act(async()=>{const r=await api("/api/gestion/presets/charger",{nom:n});rechargerEquipe(r.manquants.length?`Chargée (introuvables : ${r.manquants.join(", ")}).`:"Équipe chargée.")});
const supprPreset=n=>act(async()=>{await api("/api/gestion/presets/supprimer",{nom:n});rechargerEquipe()});

/* --- Attaques d'un Pokémon --- */
let slotSel=1, filtreAtt="", seulementEquipables=false;
async function pageAttaques(nom,msgInitial){
  let d;
  try{d=await api("/api/gestion/attaques/"+encodeURIComponent(nom))}catch(e){return e.code===401?connexion():pageEquipe(e.message)}
  H=[];

  }else if(ongletLabo==="caisson"){

    if(libre){
      h+=`<h2 style="margin-top:12px">Déposer un Pokémon</h2><div class="ligne"><input placeholder="🔍 Rechercher" value="${esc(rechCaisson)}" oninput="rechCaisson=this.value;majLabo()"><select onchange="triCaisson=this.value;majLabo()">${[["alphabetique","Alphabétique"],["rarete","Rareté"],["niveau_asc","Niveau croissant"]].map(([v,l])=>`<option value="${v}" ${v===triCaisson?"selected":""}>${l}</option>`).join("")}</select></div><div class="liste">${d.especes.map(e=>`<div class="ligne"><b>${esc(e.nom)}</b><small>Nv.${e.niveau} · ${e.pc} PC${e.en_exploration?" · en exploration":""}</small><span class="sp"></span><button onclick="${cb(()=>deposerCaisson(e.nom))}" ${e.en_exploration?"disabled":""}>Déposer</button></div>`).join("")||"<small>Aucun résultat.</small>"}</div>${d.nb_especes>d.especes.length?`<small>… ${d.nb_especes-d.especes.length} de plus : affine la recherche.</small>`:""}`;
    }
    const foc=document.activeElement&&document.activeElement.tagName==="INPUT"; el.innerHTML=h;
    if(foc){const i=el.querySelector("input");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  }else{
    const d=await api("/api/labo/mutation");if(!$("#labo"))return;
    el.innerHTML=(d.race?`<h2>🧬 ${esc(d.race.nom)} <small>(${esc(d.race.palier)})</small></h2><p><i>${esc(d.race.description)}</i></p><p>${esc(d.race.bonus)}</p>`:`<p>Tu n'as pas encore de Mutation : utilise un 🔮 Cristal de Mutation pour en tirer une au hasard (on en gagne en exploration).</p>`)+`<div class="ligne"><span>🔮 Cristaux : <b>${d.cristaux}</b></span><small>Pity : ${d.pity}/${d.pity_seuil}</small><span class="sp"></span><button class="primary" onclick="${cb(()=>muter())}" ${d.cristaux?"":"disabled"}>Utiliser un Cristal</button></div><small>Chaque tirage remplace ta Mutation actuelle.</small>`;
  }

    H=[];
    let h=`<div class="card"><h2>📨 Défis reçus</h2>`+(d.recus.map(x=>`<div class="ligne"><b>${esc(x.de_pseudo)}</b>${x.mise?`<small>mise ${x.mise} PD</small>`:""}<small>${x.secondes_restantes}s</small><span class="sp"></span><button class="primary" onclick="${cb(()=>repondrePvp(x.id,true))}">✅ Accepter</button><button onclick="${cb(()=>repondrePvp(x.id,false))}">Refuser</button></div>`).join("")||"<small>Aucun défi reçu.</small>")+`</div>`;
    h+=`<div class="card"><h2>📤 Défis envoyés</h2>`+(d.envoyes.map(x=>`<div class="ligne"><b>${esc(x.a_pseudo)}</b>${x.mise?`<small>mise ${x.mise} PD</small>`:""}<small>${x.secondes_restantes}s</small><span class="sp"></span><button onclick="${cb(()=>repondrePvp(x.id,false))}">Annuler</button></div>`).join("")||"<small>Aucun défi en attente.</small>")+`</div>`;
    h+=`<div class="card"><h2>👥 Joueurs</h2><div class="ligne"><input id="pv_q" placeholder="🔍 Rechercher un joueur" value="${esc(rechPvp)}" oninput="rechPvp=this.value;majPvpListe()"><label><small>Mise (PD)</small> <input id="pv_mise" type="number" min="0" value="0" style="width:80px"></label><small>Solde : ${d.solde}</small></div><div id="pv_liste"></div></div>`;
    $("#pv").innerHTML=h; majListe(d);
  };
  const majListe=d=>{const z=$("#pv_liste");if(z)z.innerHTML=d.joueurs.map(j=>`<div class="ligne"><b>${j.en_ligne?"🟢":"⚪"} ${esc(j.pseudo)}</b><span class="sp"></span><button onclick="${cb(()=>defierPvp(j.id))}">⚔️ Défier</button></div>`).join("")||"<small>Aucun joueur trouvé (il doit s'être connecté au site au moins une fois).</small>"};
  window.majPvpListe=()=>{clearTimeout(window._tPvp);window._tPvp=setTimeout(maj,250)};
  await maj(); minuteur=setInterval(maj,3000);
}
const defierPvp=async id=>{try{const r=await api("/api/pvp/defier",{cible_id:id,mise:parseInt(sel("pv_mise"))||0});pageDefis(esc(r.message))}catch(e){if(e.code===401)return connexion();flash(e.message,true)}};
const repondrePvp=async(id,ok)=>{try{if(ok){const r=await api("/api/pvp/accepter",{defi_id:id});combat(r.combat_id)}else{await api("/api/pvp/annuler",{defi_id:id});pageDefis()}}catch(e){if(e.code===401)return connexion();flash(e.message,true)}};

accueil();
</script>
