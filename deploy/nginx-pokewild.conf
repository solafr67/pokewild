# PokéWild — reverse proxy (site web). Installé par deploy/ouvrir-site.sh
limit_req_zone $binary_remote_addr zone=pw_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pw_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    location /auth/ {
        limit_req zone=pw_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/pokewild-proxy.conf;
    }

    location /api/ {
        limit_req zone=pw_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/pokewild-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/pokewild-proxy.conf;
    }
}
